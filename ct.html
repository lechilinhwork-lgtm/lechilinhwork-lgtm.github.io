<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Hồ sơ công trình · Đồng Tâm</title>
<meta property="og:title" content="Hồ sơ công trình · Gạch Đồng Tâm">
<meta property="og:description" content="Tiến độ thi công, hình ảnh công trình và đại lý Đồng Tâm phụ trách.">
<meta name="theme-color" content="#D7141A">
<link rel="icon" href="logo-dongtam.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--do:#D7141A;--do2:#A80F14;--do-nhat:#FDECEC;--chu:#1F1A1A;--phu:#5F5757;--vien:#ECE5E5;--nen:#F7F4F2;--xanh:#0E8A5F;--xanh-nhat:#E5F5EE}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--nen);color:var(--chu);font-size:15px;line-height:1.45;padding-bottom:84px}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.hd{background:linear-gradient(135deg,var(--do),var(--do2));color:#fff;padding:14px 0 18px}
.hd-top{display:flex;align-items:center;gap:8px}
.logo{background:#fff;border-radius:10px;padding:4px 8px;display:flex;align-items:center;gap:5px;color:var(--do);font-weight:900;font-size:16px}
.logo img{height:22px}
.ma{margin-left:auto;font-size:12px;font-weight:700;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);padding:4px 10px;border-radius:999px}
.hd h1{font-size:22px;font-weight:900;margin-top:14px;line-height:1.2;text-wrap:balance}
.hd p{font-size:13.5px;opacity:.92;margin-top:4px}
.the{background:#fff;border:1px solid var(--vien);border-radius:16px;padding:14px;margin-top:12px}
.tieu{font-size:12.5px;font-weight:800;color:var(--do);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px}
/* Tiến độ */
.td{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.td div{text-align:center;font-size:10.5px;font-weight:700;color:var(--phu);line-height:1.2}
.td div::before{content:"";display:block;height:8px;border-radius:4px;background:var(--vien);margin-bottom:6px}
.td div.qua::before{background:var(--do)}
.td div.nay{color:var(--do2)}
.td div.nay::before{background:var(--do);box-shadow:0 0 0 3px var(--do-nhat)}
.td-ghi{font-size:13px;color:var(--phu);margin-top:10px}
.td-ghi b{color:var(--chu)}
/* Ảnh */
.anh-dau{width:100%;aspect-ratio:4/3;border-radius:14px;background:#EEE center/cover no-repeat;display:block}
.lan{border-top:1px solid var(--vien);padding-top:12px;margin-top:12px}
.lan:first-of-type{border-top:none;padding-top:0;margin-top:0}
.lan-dau{display:flex;align-items:center;gap:8px;font-size:13.5px}
.lan-dau b{font-size:14px}
.lan-dau .gd{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--do2);background:var(--do-nhat);padding:2px 9px;border-radius:999px}
.luoi{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.luoi button{aspect-ratio:1/1;border-radius:10px;background:#EEE center/cover no-repeat}
.lan p{font-size:13px;color:var(--phu);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--xanh-nhat);color:#0A6B49;border:1.5px solid #BFE5D3}
.dl b{display:block;font-size:16px}
.dl small{color:var(--phu);font-size:13px}
.hang{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.nut{display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:12px;font-weight:700;font-size:14px;border:1.5px solid var(--vien);background:#fff;white-space:nowrap}
.nut.chinh{background:var(--do);color:#fff;border-color:var(--do)}
.nut.zalo{color:#0068FF;border-color:#CFE0FF;background:#F3F7FF}
.cta{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#2B2323,#4A3A3A);color:#fff;border-radius:16px;padding:14px;margin-top:12px}
.cta b{display:block;font-size:15.5px}
.cta small{opacity:.85;font-size:12.5px}
.cta span.mui{margin-left:auto;font-size:22px}
.trong{text-align:center;color:var(--phu);padding:40px 10px}
.xoay{width:22px;height:22px;border:3px solid var(--vien);border-top-color:var(--do);border-radius:50%;animation:x .8s linear infinite;margin:0 auto 10px}
@keyframes x{to{transform:rotate(360deg)}}
.chan{text-align:center;font-size:12px;color:var(--phu);padding:22px 0 8px}
.thanh{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(255,255,255,.97);border-top:1px solid var(--vien);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.thanh .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1.3fr 1fr;gap:8px}
.thanh .nut{height:46px}
/* Xem ảnh to */
.xem{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:30;display:none;align-items:center;justify-content:center}
.xem.mo{display:flex}
.xem img{max-width:100%;max-height:100%;object-fit:contain}
.xem .dong{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:20px}
.xem .tr,.xem .ph{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;color:#fff;font-size:30px;background:rgba(255,255,255,.08)}
.xem .tr{left:0;border-radius:0 12px 12px 0}.xem .ph{right:0;border-radius:12px 0 0 12px}
.xem .so{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;opacity:.8}
/* ===== TỐI GIẢN (Minimalist) ===== */
:root{--nen:#FAFAF8;--vien:#E9E6E1;--chu:#161616;--phu:#6E6A66;--do:#C8102E;--do2:#9E0B22;--do-nhat:#F7F3F1;--xanh:#2F6B4F;--xanh-nhat:#F1F4F1}
.hd{background:#fff;color:var(--chu);border-bottom:1px solid var(--vien);padding:18px 0 26px}
.logo{background:none;padding:0}
.ma{background:none;border:1px solid var(--vien);color:var(--phu)}
.hd h1{font-weight:700;letter-spacing:-.6px;font-size:25px;margin-top:24px}
.hd p{color:var(--phu);opacity:1}
.the{border:none;border-top:1px solid var(--vien);border-radius:0;background:none;padding:20px 0 0;margin-top:22px}
.tieu{color:var(--phu);font-size:11.5px;font-weight:600;letter-spacing:1.2px}
.td div.qua::before,.td div.nay::before{background:var(--chu)}
.td div.nay{color:var(--chu)}
.td div.nay::before{box-shadow:none}
.lan-dau .gd{background:#F4F2EE;color:var(--chu);font-weight:600}
.chips span{background:#fff;border:1px solid var(--vien);color:var(--chu);font-weight:500}
.nut{border:1px solid var(--vien);border-radius:10px;font-weight:600}
.nut.chinh{background:var(--do);border-color:var(--do)}
.nut.zalo{background:#fff;border-color:var(--vien);color:var(--chu)}
.cta{background:#fff;color:var(--chu);border:1px solid var(--chu);border-radius:12px}
.cta small{color:var(--phu);opacity:1}
.thanh{border-top:1px solid var(--vien)}

</style>
</head>
<body>
<header class="hd"><div class="wrap">
  <div class="hd-top"><div class="logo"><img src="logo-dongtam.png" alt="">Dongtam</div><div class="ma" id="ma">Hồ sơ công trình</div></div>
  <h1 id="tieu-de">Hồ sơ công trình</h1>
  <p id="phu-de">Tiến độ thi công và hình ảnh tại công trình</p>
</div></header>

<main class="wrap" id="nd"><div class="the trong"><div class="xoay"></div>Đang tải hồ sơ…</div></main>

<nav class="thanh an" id="thanh"><div class="in">
  <a class="nut chinh" id="t-goi">Gọi đại lý</a>
  <a class="nut" id="t-xem" href="./">Xem mẫu gạch</a>
</div></nav>

<div class="xem" id="xem"><img id="xem-anh" alt=""><button class="dong" id="xem-dong" aria-label="Đóng">✕</button><button class="tr" id="xem-tr" aria-label="Ảnh trước">‹</button><button class="ph" id="xem-ph" aria-label="Ảnh sau">›</button><span class="so" id="xem-so"></span></div>

<script src="dai-ly.js"></script>
<script>
(function(){
'use strict';
// Link Web App "Hồ sơ công trình" (…/exec) — giống trong chao-cong-trinh.html
var CT_API='https://script.google.com/macros/s/AKfycbzJuuVpMZgf2_Hdckq7zuHhf_BHtSeIjBZREvsek9TiggfoPUnA2vYM9SfiX--7yaJ-ug/exec';
var GD=['Đang xây thô','Cất nóc','Tô tường','Sắp lát nền','Hoàn thiện'];
var GD_NGAN=['Xây thô','Cất nóc','Tô tường','Sắp lát','Hoàn thiện'];

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function anh(id,w){ return 'https://lh3.googleusercontent.com/d/'+id+'=w'+(w||600); }
function ngay(t){ return new Date(t).toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function loi(t){ $('nd').innerHTML='<div class="the trong">'+t+'<br><br><a class="nut chinh" href="./" style="display:inline-flex;padding:0 18px">Xem mẫu gạch, ngói Đồng Tâm</a></div>'; }

var id=(new URLSearchParams(location.search).get('id')||'').trim();
if(!id){ loi('Link hồ sơ chưa đúng.'); return; }
if(!CT_API){ loi('Hồ sơ công trình đang được cài đặt.'); return; }

var cb='_ct'+Date.now(), s=document.createElement('script'), xong=false;
window[cb]=function(r){ xong=true; delete window[cb]; s.remove(); if(r&&r.ok) ve(r); else loi('Không tìm thấy hồ sơ công trình '+esc(id)+'.'); };
s.src=CT_API+'?action=xem&id='+encodeURIComponent(id)+'&callback='+cb;
s.onerror=function(){ loi('Chưa tải được hồ sơ. Kiểm tra mạng rồi tải lại trang.'); };
setTimeout(function(){ if(!xong) loi('Mạng chậm, chưa tải được hồ sơ. Thử tải lại trang.'); },25000);
document.head.appendChild(s);

var TAT_CA=[];   // mọi ảnh để xem to + vuốt
function ve(r){
  var d=timDaiLy(r.dl), ch=null;
  if(d){ ch=d.cuaHang.filter(function(c){ return c.diaChi===r.ch; })[0]||d.cuaHang[0]; }
  var iGd=GD.indexOf(r.gd);
  $('ma').textContent='Mã '+r.id;
  $('tieu-de').textContent = d ? 'Công trình gần '+d.ten : 'Hồ sơ công trình';
  $('phu-de').textContent = 'Cập nhật '+ngay(r.capNhat)+' · '+r.lan.length+' lần ghé'+(r.gd?' · '+r.gd:'');
  document.title='Công trình '+r.id+' · Đồng Tâm';

  var h='';
  // Tiến độ
  h+='<section class="the"><div class="tieu">Tiến độ thi công</div><div class="td">'
    +GD_NGAN.map(function(g,i){ return '<div class="'+(i<iGd?'qua':i===iGd?'nay':'')+'">'+g+'</div>'; }).join('')+'</div>'
    +'<div class="td-ghi">Hiện tại: <b>'+esc(r.gd||'chưa rõ')+'</b>'+(iGd>=0&&iGd<3?' · Còn thời gian chọn gạch, nên xem mẫu thật sớm để kịp đặt hàng.':iGd>=3?' · Sắp lát, nên chốt mẫu và số lượng ngay.':'')+'</div></section>';
  // Ảnh theo từng lần ghé
  var co=r.lan.filter(function(l){return l.anh.length;});
  if(co.length){
    h+='<section class="the"><div class="tieu">Hình ảnh tại công trình</div>';
    co.forEach(function(l,k){
      h+='<div class="lan"><div class="lan-dau"><b>'+ngay(l.t)+'</b><span style="color:var(--phu)">'+l.anh.length+' ảnh</span>'+(l.gd?'<span class="gd">'+esc(l.gd)+'</span>':'')+'</div>';
      if(k===0){ h+='<button class="anh-dau" data-i="'+TAT_CA.length+'" style="margin-top:8px;background-image:url(\''+anh(l.anh[0],1000)+'\')"></button>'; TAT_CA.push(l.anh[0]); }
      var con=k===0?l.anh.slice(1):l.anh;
      if(con.length) h+='<div class="luoi">'+con.map(function(a){ TAT_CA.push(a); return '<button data-i="'+(TAT_CA.length-1)+'" style="background-image:url(\''+anh(a,400)+'\')"></button>'; }).join('')+'</div>';
      if(l.ghiChu) h+='<p>'+esc(l.ghiChu)+'</p>';
      h+='</div>';
    });
    h+='</section>';
  }
  // Nhu cầu
  if(r.can) h+='<section class="the"><div class="tieu">Vật liệu cần</div><div class="chips">'+r.can.replace(/Keo, chà ron/g,'Keo & chà ron').split(',').map(function(x){return '<span>'+esc(x.trim())+'</span>';}).join('')+'</div></section>';
  // Vị trí
  if(r.lat&&r.lng) h+='<section class="the"><div class="tieu">Vị trí công trình</div><a class="nut" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+r.lat+','+r.lng+'">Mở trên Google Maps</a></section>';
  // Đại lý phụ trách
  if(d&&ch){
    var sdt=ch.sdt||HOTLINE_HO_TRO;
    h+='<section class="the dl"><div class="tieu">Đại lý Đồng Tâm phụ trách</div><b>'+esc(d.ten)+'</b><small>'+esc(ch.diaChi)+'</small>'
      +'<div class="hang"><a class="nut chinh" href="tel:'+sdt+'">Gọi</a><a class="nut zalo" target="_blank" rel="noopener" href="https://zalo.me/'+sdt+'">Zalo</a><a class="nut" target="_blank" rel="noopener" href="'+linkChiDuong(ch)+'">Chỉ đường</a></div>'
      +'<p style="font-size:13px;color:var(--phu);margin-top:10px">Có sẵn mẫu thật trưng bày. Ghé xem, nhận báo giá và chiết khấu theo công trình.</p></section>';
    $('t-goi').href='https://zalo.me/'+sdt; $('t-goi').target='_blank'; $('t-goi').textContent='Zalo '+d.ten;
    $('t-xem').href='./?ct='+encodeURIComponent(r.id);
  } else { $('t-goi').href='./#dai-ly'; $('t-goi').textContent='Đại lý gần bạn'; }
  h+='<a class="cta" href="'+$('t-xem').getAttribute('href')+'"><span><b>Chọn gạch, ngói cho công trình này</b><small>Xem mẫu, giá niêm yết, tính số thùng theo diện tích</small></span><span class="mui">›</span></a>';
  h+='<div class="chan">Gạch Đồng Tâm · Vì cuộc sống tươi đẹp<br>Tư vấn, báo giá và giao hàng do đại lý Đồng Tâm phụ trách thực hiện.</div>';
  $('nd').innerHTML=h;
  $('thanh').classList.remove('an');
  Array.prototype.forEach.call(document.querySelectorAll('[data-i]'),function(b){ b.onclick=function(){ moAnh(+b.dataset.i); }; });
}

// Xem ảnh to
var dang=0;
function moAnh(i){ dang=(i+TAT_CA.length)%TAT_CA.length; $('xem-anh').src=anh(TAT_CA[dang],1600); $('xem-so').textContent=(dang+1)+' / '+TAT_CA.length; $('xem').classList.add('mo'); }
$('xem-dong').onclick=function(){ $('xem').classList.remove('mo'); };
$('xem-tr').onclick=function(){ moAnh(dang-1); };
$('xem-ph').onclick=function(){ moAnh(dang+1); };
var x0=null; $('xem').addEventListener('touchstart',function(e){ x0=e.touches[0].clientX; },{passive:true});
$('xem').addEventListener('touchend',function(e){ if(x0==null) return; var dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>50) moAnh(dang+(dx<0?1:-1)); x0=null; });
document.addEventListener('keydown',function(e){ if(!$('xem').classList.contains('mo')) return; if(e.key==='Escape') $('xem').classList.remove('mo'); if(e.key==='ArrowLeft') moAnh(dang-1); if(e.key==='ArrowRight') moAnh(dang+1); });
})();
</script>
<style>.an{display:none!important}</style>
</body>
</html>
